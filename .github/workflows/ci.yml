name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**']

permissions:
  contents: read

jobs:
  check-files:
    name: Check required files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README and CONTRIBUTING exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
